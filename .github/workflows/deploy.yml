name: Deploy Nuxt Frontend to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Static Production Build
        run: npm run generate
        env:
          NUXT_PUBLIC_API_BASE: https://api.canagardens.co.ke/api

      - name: Copy .htaccess to build
        run: cp public/.htaccess .output/public/.htaccess

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync to Hostinger via Rsync
        run: |
          rsync -avz --exclude='api-backend' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            .output/public/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/u585677773/domains/canagardens.co.ke/public_html/
